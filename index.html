<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch Club Venezuela</title><link rel="stylesheet" href="css/styles.css"><script src="js/products.js" defer></script><script src="js/pages.js" defer></script></head><body><header class="header"><a class="brand" href="index.html">WATCH CLUB</a><nav class="nav"><a href="index.html">Inicio</a><a href="index.html#coleccion">Relojes</a><a href="nosotros.html">Nosotros</a><a href="como-comprar.html">Cómo comprar</a><a href="contacto.html">Contacto</a></nav><a class="btn js-wa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a></header><main><section class="hero"><div><small class="accent">MÁS QUE RELOJES</small><h1>Relojes que hablan de ti.</h1><p>Una selección de relojes originales para acompañarte todos los días.</p><a class="btn" href="#coleccion">VER COLECCIÓN</a></div><img src="assets/products/expedition-acadia-verde/expedition-acadia-verde-01.webp" alt="Timex Expedition Acadia"></section><section id="coleccion" class="section"><h2>Nuestra colección</h2><div id="grid" class="grid"></div></section></main><footer class="footer"><strong>WATCH CLUB</strong><span>Caracas, Venezuela · Envíos nacionales</span><a class="js-ig" href="#" target="_blank" rel="noopener noreferrer">@watchclub.vzla</a></footer><script>document.addEventListener('DOMContentLoaded',()=>{const c=WatchClubCatalog,g=document.querySelector('#grid');c.getAvailableProducts().forEach(p=>{const a=document.createElement('article');a.className='card';a.innerHTML=`<a href="producto.html?id=${p.id}"><img src="${p.images[0]}" alt="${p.model}"><small>${p.brand}</small><h3>${p.model}</h3><p>${p.variant}</p></a><div class="cardActions"><strong class="price">${c.formatPrice(p)}</strong><a class="btn" target="_blank" rel="noopener noreferrer" href="${c.getWhatsAppUrl(p)}">WhatsApp</a></div>`;g.appendChild(a)})});</script></body></html>
